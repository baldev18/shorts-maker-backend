services:
  shorts-api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - shorts-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  shorts-data:
